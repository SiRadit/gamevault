<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tambah Game - GameVault</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar responsif: jadi menu hamburger di layar kecil -->
  <nav class="navbar navbar-expand-md navbar-dark bg-danger">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">GameVault</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link" href="koleksi.html">Koleksi</a></li>
          <li class="nav-item"><a class="nav-link active" href="tambah-game.html">Tambah Game</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <h1 class="h3 mb-3">Tambah Game</h1>

    <div class="row">
      <div class="col-lg-6">
        <form class="card card-body">
          <div class="mb-3">
            <label for="judul" class="form-label">Judul game</label>
            <input type="text" id="judul" class="form-control" placeholder="Contoh: Hollow Knight" required>
          </div>
          <div class="mb-3">
            <label for="platform" class="form-label">Platform</label>
            <select id="platform" class="form-select" required>
              <option value="">Pilih platform</option>
              <option>PC</option>
              <option>PlayStation</option>
              <option>Nintendo Switch</option>
              <option>Mobile</option>
            </select>
          </div>
          <div class="mb-3">
            <label for="genre" class="form-label">Genre</label>
            <input type="text" id="genre" class="form-control">
          </div>
          <div class="mb-3">
            <label for="status" class="form-label">Status</label>
            <select id="status" class="form-select">
              <option>Backlog</option>
              <option>Dimainkan</option>
              <option>Selesai</option>
            </select>
          </div>
          <div class="d-grid d-sm-flex gap-2">
            <button type="submit" class="btn btn-danger">Simpan</button>
            <a href="koleksi.html" class="btn btn-outline-secondary">Batal</a>
          </div>
        </form>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
