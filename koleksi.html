<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Koleksi - GameVault</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

  <!-- Navbar responsif: jadi menu hamburger di layar kecil -->
  <nav class="navbar navbar-expand-md navbar-dark bg-danger">
    <div class="container">
      <a class="navbar-brand fw-bold" href="index.html">GameVault</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#menu" aria-controls="menu" aria-expanded="false" aria-label="Buka menu">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="menu">
        <ul class="navbar-nav ms-auto">
          <li class="nav-item"><a class="nav-link" href="index.html">Dashboard</a></li>
          <li class="nav-item"><a class="nav-link active" href="koleksi.html">Koleksi</a></li>
          <li class="nav-item"><a class="nav-link" href="tambah-game.html">Tambah Game</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <div class="container py-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
      <h1 class="h3 mb-0">Koleksi Game</h1>
      <a href="tambah-game.html" class="btn btn-danger">Tambah</a>
    </div>

    <div class="card">
      <div class="table-responsive">
        <table class="table table-striped mb-0">
          <thead>
            <tr><th>#</th><th>Judul</th><th>Platform</th><th>Genre</th><th>Status</th></tr>
          </thead>
          <tbody>
          <tr>
            <td>1</td><td>Hades</td><td>PC</td><td>Roguelike</td>
            <td><span class="badge text-bg-success">Selesai</span></td>
          </tr>
          <tr>
            <td>2</td><td>Celeste</td><td>PC</td><td>Platformer</td>
            <td><span class="badge text-bg-success">Selesai</span></td>
          </tr>
          <tr>
            <td>3</td><td>Hollow Knight</td><td>PC</td><td>Metroidvania</td>
            <td><span class="badge text-bg-primary">Dimainkan</span></td>
          </tr>
          <tr>
            <td>4</td><td>Stardew Valley</td><td>PC</td><td>Simulasi</td>
            <td><span class="badge text-bg-primary">Dimainkan</span></td>
          </tr>
          <tr>
            <td>5</td><td>Elden Ring</td><td>PS5</td><td>Action RPG</td>
            <td><span class="badge text-bg-secondary">Backlog</span></td>
          </tr>
          <tr>
            <td>6</td><td>Disco Elysium</td><td>PC</td><td>RPG</td>
            <td><span class="badge text-bg-secondary">Backlog</span></td>
          </tr>
